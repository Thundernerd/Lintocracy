services:
  app:
    image: tnrd/lintocracy:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      NUXT_ADMIN_SECRET: ${ADMIN_SECRET:-change-me-to-a-long-random-string}
    volumes:
      - lintocracy-data:/app/.data
    restart: unless-stopped
    healthcheck:
      # The image has no wget or curl, so check with Node's global fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lintocracy-data:
