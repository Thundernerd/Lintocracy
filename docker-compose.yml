services:
  app:
    image: tnrd/rule-wars:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      DATABASE_URL: file:/data/rule-wars.db
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-to-a-long-random-string}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
    volumes:
      - rule-wars-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:${PORT:-3000}/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rule-wars-data:
